[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-voice-agent"
version = "0.1.0"
description = "Unified Project Architecture for Agentic AI and Real-time Voice Agent"
authors = [{ name = "TMA Solutions" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17.0",
    "rank-bm25>=0.2.2",
    "opentelemetry-api>=1.22.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
