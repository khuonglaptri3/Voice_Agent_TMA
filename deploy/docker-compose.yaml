version: '3.8'

services:
  voice-agent:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.voice
    env_file: ../.env
    ports:
      - "7860:7860"
    restart: unless-stopped

  api-server:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    env_file: ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped
